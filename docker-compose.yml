x-app: &app
  build: .
  env_file:
    - .env
  expose:
    - "5000"
  environment: &app-env
    NODE_ENV: production
    PORT: "5000"
    IP: "0.0.0.0"
    IP_ADDRESS: "0.0.0.0"
    DATABASE_URL: mongodb://mongodb:27017/vivaleveDB
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    BULLMQIP: redis
    BULLMQPORT: "6379"
    MEILI_HOST: http://meilisearch:7700
    RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
  depends_on:
    redis:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    meilisearch:
      condition: service_started
    rabbitmq:
      condition: service_started
  networks:
    - backend
  restart: unless-stopped

services:
  app1:
    <<: *app
    container_name: vivaleve-app1
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      <<: *app-env
      INSTANCE_ID: "1"

  app2:
    <<: *app
    container_name: vivaleve-app2
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      <<: *app-env
      INSTANCE_ID: "2"

  app3:
    <<: *app
    container_name: vivaleve-app3
    ports:
      - "127.0.0.1:5003:5000"
    environment:
      <<: *app-env
      INSTANCE_ID: "3"

  app4:
    <<: *app
    container_name: vivaleve-app4
    ports:
      - "127.0.0.1:5004:5000"
    environment:
      <<: *app-env
      INSTANCE_ID: "4"

  redis:
    image: redis:latest
    container_name: vivaleve-redis
    volumes:
      - redisdata:/data
    networks:
      backend:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.2
    container_name: meilisearch-server
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
    volumes:
      - meilisearchdata:/data
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: mongodb
    volumes:
      - mongodata:/data/db
    networks:
      backend:
        aliases:
          - mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  redisdata:
  meilisearchdata:
  mongodata:
  rabbitmqdata:
